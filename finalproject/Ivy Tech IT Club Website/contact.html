<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contact | IT Club</title>

<link rel="stylesheet" href="styles.css">

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&display=swap" rel="stylesheet">

<style>

body {
    font-family: 'Orbitron', sans-serif;
    background: #0f172a;
    color: white;
    margin: 0;
}

/* Navigation */

.glass {
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(10px);
    padding: 15px 0;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 20px;
}

.nav-flex {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

nav ul {
    display: flex;
    list-style: none;
    gap: 15px;
    padding: 0;
}

nav a {
    color: white;
    text-decoration: none;
    padding: 10px 16px;
    border-radius: 8px;
    transition: 0.3s;
}

nav a:hover,
nav a.active {
    background: white;
    color: #111827;
}

/* Form Styling */

form {
    display: flex;
    flex-direction: column;
    gap: 15px;
    background: rgba(255,255,255,0.08);
    padding: 30px;
    border-radius: 12px;
    backdrop-filter: blur(10px);
    margin-top: 30px;
}

input,
textarea {
    padding: 12px;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
}

button {
    background: #2563eb;
    color: white;
    border: none;
    padding: 12px;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.3s;
    font-family: 'Orbitron', sans-serif;
}

button:hover {
    background: #1d4ed8;
    transform: scale(1.03);
}

/* Success Message */

#success-message {
    display: none;
    margin-top: 20px;
    padding: 20px;
    background: #16a34a;
    border-radius: 10px;
    text-align: center;
    animation: fadeIn 0.6s ease;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(15px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Mobile */

@media (max-width: 768px) {

    .nav-flex {
        flex-direction: column;
    }

    nav ul {
        flex-direction: column;
        text-align: center;
    }
}

</style>
</head>

<body>

<header class="glass">

<div class="container nav-flex">

<h1>Contact</h1>

<nav>
<ul>
<li><a href="index.html">Home</a></li>
<li><a href="about.html">About</a></li>
<li><a href="events.html">Events</a></li>
<li><a href="members.html">Members</a></li>
<li><a href="resources.html">Resources</a></li>
<li><a class="active" href="contact.html">Contact</a></li>
</ul>
</nav>

</div>

</header>

<main class="container">

<h2>Contact Us With Questions Or Concerns!</h2>

<form 
id="contact-form"
action="https://webdevbasics.net/scripts/demo.php"
method="post">

<label for="name">Name:</label>
<input type="text" id="name" name="name" required>

<label for="email">Email:</label>
<input type="email" id="email" name="email" required>

<label for="phone number">Phone Number:</label>
<input type="phone number" id="phone number" name="phone number" required>

<label for="message">Message:</label>
<textarea id="message" name="message" rows="6" required></textarea>

<button type="submit">Submit</button>

</form>

<div id="success-message">

<h2>Thank you for reaching out to us!</h2>

<p>
We will respond to your message/question soon!
</p>

</div>

</main>

<script>

document.getElementById('contact-form').addEventListener('submit', function(event) {

    event.preventDefault();

    document.getElementById('success-message').style.display = 'block';

    document.getElementById('contact-form').reset();

});

</script>

<script src="script.js"></script>

</body>
</html>
