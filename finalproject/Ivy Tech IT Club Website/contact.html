<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&display=swap"
rel="stylesheet">

</head>

<body>

<header class="glass">

<div class="container nav-flex">

<h1>Contact Us With Any Questions/Concerns!</h1>

<div class="menu-toggle"
id="menu-toggle">☰</div>

<nav id="nav-menu">

<ul>

href="contact.html">Contact</a></li>

</nav>

</div>

</header>

<main class="container">

<form
id="contact-form"
action="https://webdevbasics.net/scripts/demo.php"
method="post">

<label for="name">Name</label>

<input type="text"
id="name"
name="name"
required>

<label for="email">Email</label>

<input type="email"
id="email"
name="email"
required>

<label for="phone number">Phone Number</label>

<input type="tel"
id="phone"
name="phone"
required>

<label for="message">Message</label>

<textarea
id="message"
name="message"
rows="6"
required>

</textarea>

<button type="submit">

Submit

</button>

</form>

<div id="success-message"
style="display:none;">

<h2>
Thank you for reaching out to us!
</h2>

<p>
We will respond to your
message/question soon!
</p>

</div>

</main>

<footer>

<p>
&copy; 2026 Ivy Tech Community College South Bend-Elkhart
</p>

</footer>

</body>
